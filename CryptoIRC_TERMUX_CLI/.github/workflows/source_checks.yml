name: Source checks
on: [push, pull_request]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          paths=[p for p in Path('.').rglob('*.py') if '.venv' not in p.parts]
          for path in paths:
              compile(path.read_bytes(), str(path), 'exec')
          print('Compiled source:',len(paths))
          PYCODE
      - name: Bash syntax
        run: find . -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
